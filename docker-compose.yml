services:
  user-mgmt:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.golangapp.rule=PathPrefix(`{catchall:.*}`)"
      - "traefik.http.routers.golangapp.entrypoints=gakuren-network"
      - "traefik.http.services.golangapp.loadbalancer.server.port=3000"
    expose:
      - "3000"
    networks:
      - gakuren-network

networks:
  gakuren-network:
    external: true