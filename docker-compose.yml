services:
  user-mgmt:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.usermgmt.rule=PathPrefix(`/`)"
      - "traefik.http.routers.usermgmt.entrypoints=gakuren-network"
      - "traefik.http.services.usermgmt.loadbalancer.server.port=3000"
      - "traefik.http.routers.usermgmt.service=user-mgmt-svc"
    expose:
      - "3000"
    networks:
      - gakuren-network

networks:
  gakuren-network:
    external: true