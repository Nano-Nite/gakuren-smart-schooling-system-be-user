services:
  user-mgmt:
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.user-mgmt-router.rule=PathPrefix(`/v1/auth`)"
      - "traefik.http.routers.user-mgmt-router.entrypoints=web"
      - "traefik.http.services.user-mgmt-service.loadbalancer.server.port=3000"
    expose:
      - "3000"
    networks:
      gakuren-network:
        aliases:
          - user-mgmt

networks:
  gakuren-network:
    external: true